<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title><link rel="stylesheet" href="style.css">
<style>
.profile-card{background:#fff;border:1px solid #e5e8ef;border-radius:12px;padding:25px;max-width:800px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group label{display:block;font-size:13px;color:#667085;margin-bottom:7px}
.form-group input{width:100%;padding:12px;border:1px solid #dce1ea;border-radius:8px}
.form-group.full{grid-column:1/-1}.save-btn{margin-top:20px;background:#1769e0;color:#fff;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="logo">🎓 Placement Portal</div><nav>
<a href="index.html">🏠 Dashboard</a><a href="jobs.html">💼 Jobs</a><a href="applications.html">📋 My Applications</a>
<a href="profile.html" class="active">👤 My Profile</a><a href="notifications.html">🔔 Notifications</a>
<a href="javascript:void(0)" onclick="logout()">🚪 Logout</a></nav></aside>
<main class="main"><header class="topbar"><h2>Placement Portal</h2><div class="user">👤<div><strong>Student_name</strong><small>CSE | 2026 Batch</small></div></div></header>
<section class="content"><h1>My Profile</h1><p>Keep your placement profile updated.</p>
<div class="profile-card"><form id="profileForm"><div class="form-grid">
<div class="form-group"><label>Full Name</label><input id="name" required></div>
<div class="form-group"><label>Department</label><input id="department" required></div>
<div class="form-group"><label>Batch</label><input id="batch" required></div>
<div class="form-group"><label>CGPA</label><input id="cgpa" required></div>
<div class="form-group"><label>Email</label><input id="email" type="email" required></div>
<div class="form-group"><label>Phone</label><input id="phone"></div>
<div class="form-group full"><label>Skills</label><input id="skills" placeholder="Java, Python, SQL"></div>
</div><button class="save-btn" type="submit">Save Profile</button></form></div>
</section></main></div>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const p=getJSON(STORE.profile,defaultProfile);
 ["name","department","batch","cgpa","email","phone","skills"].forEach(k=>document.getElementById(k).value=p[k]||"");
 document.getElementById("profileForm").addEventListener("submit",e=>{
   e.preventDefault(); const q={}; ["name","department","batch","cgpa","email","phone","skills"].forEach(k=>q[k]=document.getElementById(k).value.trim());
   setJSON(STORE.profile,q); notify("Profile updated successfully."); updateStudentHeader(); showMessage("Profile saved successfully.");
 });
});
</script></body></html>
